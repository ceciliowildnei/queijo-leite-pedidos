name: Gerar pacote web instalavel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "vite.config.*"
      - ".github/workflows/build-web-public.yml"

jobs:
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar versao web
        run: npm run build

      - name: Disponibilizar pacote
        uses: actions/upload-artifact@v4
        with:
          name: queijos-wr-web-instalavel
          path: dist
          if-no-files-found: error
