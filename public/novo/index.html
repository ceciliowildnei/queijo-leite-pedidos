<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queijos WR Pedidos - Novo Sistema</title>
<style>
:root{--cream:#fffaf1;--bg:#f4ead8;--dark:#211106;--brown:#5a3216;--gold:#b77b24;--green:#07451f;--line:#ead8b4;--muted:#75614a;--ok:#e5f6e5;--warn:#fff1d5;--bad:#ffe4dd}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#fffaf0,#ead3a4);color:#21140b}.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.side{background:radial-gradient(circle at 20% 10%,#5a3318,#1d0f06 62%);color:#fff;padding:28px 18px}.brand{text-align:center;margin-bottom:28px}.logo{font-family:Georgia,serif;font-size:38px;font-weight:900;line-height:1}.logo small{display:block;font-family:Arial,sans-serif;font-size:12px;letter-spacing:4px;color:#d3a44a;margin-top:8px}.slogan{font-family:Georgia,serif;font-style:italic;color:#fff5d7}.quote{margin-top:70px;text-align:center;color:#efd8a7;font-family:Georgia,serif}.side button{display:block;width:100%;text-align:left;background:transparent;color:white;border:0;border-radius:13px;padding:14px 16px;font-weight:800;margin:7px 0;cursor:pointer}.side button.on{background:linear-gradient(135deg,#86500f,#b77b24)}.main{padding:28px;max-width:1500px;width:100%;margin:auto}button,.btn{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;font-weight:800;background:linear-gradient(135deg,#7b481d,#b77b24);color:#fff}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fffdf8;font:inherit}textarea{min-height:90px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:34px}.top p{margin:4px 0;color:var(--muted)}.sync{background:var(--green)}.ghost{background:#fffaf2;color:var(--brown);border:1px solid var(--line)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:18px}.card,.panel{background:var(--cream);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 16px 40px #5a32101a}.card span{color:var(--muted);font-weight:800}.card strong{display:block;font-size:28px;color:var(--green);margin-top:10px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}.panel{margin-bottom:18px}.panel h2{margin:0 0 16px;color:var(--brown)}.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:14px}.table{overflow:auto;border:1px solid var(--line);border-radius:16px}.table table{width:100%;border-collapse:collapse;background:#fffdf8}.table th{background:#f4ead7;text-align:left;color:#4c2b16}.table th,.table td{padding:13px;border-bottom:1px solid #efdfc2;vertical-align:top}.chip{display:inline-flex;border:1px solid #e5cfa4;background:#fff6e6;color:#5b3416;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;margin:2px}.ok{background:var(--ok);color:#14551c}.warn{background:var(--warn);color:#8a4a08}.bad{background:var(--bad);color:#8a2719}.order-group{border:1px solid var(--line);border-radius:20px;margin:18px 0;background:#fffdf8;overflow:hidden}.group-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:#fbf1dc;border-bottom:1px solid var(--line)}.group-head h3{margin:0}.order{display:grid;grid-template-columns:1.35fr 1fr 1fr 1.2fr 1fr auto;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid #f0dfbd}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{padding:8px 10px;font-size:12px}.btn-ok{background:var(--green)}.btn-light{background:#fff;color:#5c3216;border:1px solid #e7d4ad}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.quick{display:flex;gap:8px;flex-wrap:wrap}.quick button{background:#fff6e6;color:#5b3416;border:1px solid #e5cfa4;box-shadow:none;padding:8px 10px}.route-card{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:14px;border-bottom:1px solid #efdfc2}.num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#faedce;color:#91520e;font-weight:900}.alert{background:#fff4d6;border:1px solid #e6c88c;border-radius:16px;padding:14px;margin-bottom:16px}.chart{height:160px;border-radius:18px;background:linear-gradient(180deg,#fffdf8,#f5ead2);border:1px solid var(--line);display:flex;align-items:end;gap:12px;padding:14px}.bar{flex:1;background:linear-gradient(#dca24a,#8eb184);border-radius:8px 8px 0 0}@media(max-width:900px){.app{grid-template-columns:1fr}.cards,.grid,.form{grid-template-columns:1fr}.order{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}.toolbar{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>
<div id="root"><div class="alert">Carregando banco de dados real do sistema...</div></div>
<script>
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmt=v=>{if(!v)return'Sem data';let p=String(v).slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:v};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const tags=t=>String(t||'').split(/[;,\n]/).map(x=>x.trim()).filter(Boolean).slice(0,6);
const lucro=p=>Number(p.total||0)*0.30;
let DB={clientes:[],produtos:[],pedidos:[],admins:[]}, tab='dashboard';
async function creds(){const js=await fetch('/src/main.jsx',{cache:'no-store'}).then(r=>r.text());const url=(js.match(/https:\/\/[a-z0-9]+\.supabase\.co/i)||[])[0];const key=(js.match(/sb_publishable_[A-Za-z0-9_\-]+/)||[])[0];if(!url||!key)throw new Error('Não encontrei a conexão do banco no app antigo.');return{url,key}}
async function get(table,query='select=*'){const c=await creds();const r=await fetch(c.url+'/rest/v1/'+table+'?'+query,{headers:{apikey:c.key,Authorization:'Bearer '+c.key}});if(!r.ok)throw new Error('Erro ao carregar '+table);return r.json()}
async function patchPedido(id,obj){const c=await creds();const r=await fetch(c.url+'/rest/v1/wr_pedidos?id=eq.'+id,{method:'PATCH',headers:{apikey:c.key,Authorization:'Bearer '+c.key,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(obj)});if(!r.ok)alert('Não consegui atualizar o pedido.');await load()}
async function load(){try{DB.clientes=await get('wr_clientes','select=*&order=criado_em.desc');DB.produtos=await get('wr_produtos','select=*&order=nome.asc');DB.pedidos=await get('wr_pedidos','select=*&order=data_entrega.asc&order=criado_em.desc');DB.admins=await get('wr_admins','select=*&order=criado_em.desc');render()}catch(e){root.innerHTML='<div class="alert">'+esc(e.message)+'</div>'}}
function group(list){return list.reduce((a,p)=>{let k=p.data_entrega||'sem-data';(a[k]||(a[k]=[])).push(p);return a},{})}
function resumo(){let total=DB.pedidos.reduce((s,p)=>s+Number(p.total||0),0);return{pedidos:DB.pedidos.length,total,lucro:DB.pedidos.reduce((s,p)=>s+lucro(p),0),aberto:DB.pedidos.filter(p=>p.status_pagamento!=='Pago').reduce((s,p)=>s+Number(p.total||0),0),pend:DB.pedidos.filter(p=>p.status_pedido!=='Entregue').length}}
function chips(t){let a=tags(t);return a.length?a.map(x=>'<span class="chip">'+esc(x)+'</span>').join(''):'<span class="chip">Sem observação</span>'}
function shell(content,title,sub){let tabs=['dashboard','clientes','produtos','novo pedido','pedidos','entregas','relatórios','admins'];return '<div class="app"><aside class="side"><div class="brand"><div class="logo">Queijos WR<small>PEDIDOS</small></div><p class="slogan">Sabor e tradição de família</p></div><nav>'+tabs.map(t=>'<button class="'+(tab===t?'on':'')+'" onclick="tab=\''+t+'\';render()">'+t+'</button>').join('')+'</nav><p class="quote">“Tradição que vem da nossa família para a sua.”</p></aside><main class="main"><div class="top"><div><h1>'+title+'</h1><p>'+sub+'</p></div><div><button class="sync" onclick="load()">⟳ Atualizar / Sincronizar</button> <b>WR</b> Banco real <button class="ghost" onclick="location.href=\'/\'">Voltar</button></div></div>'+content+'</main></div>'}
function cards(){let r=resumo();return '<section class="cards"><div class="card"><span>Pedidos no banco</span><strong>'+r.pedidos+'</strong></div><div class="card"><span>Faturamento</span><strong>'+money(r.total)+'</strong></div><div class="card"><span>Lucro estimado</span><strong>'+money(r.lucro)+'</strong></div><div class="card"><span>Valor em aberto</span><strong>'+money(r.aberto)+'</strong></div></section>'}
function table(list){return '<div class="table"><table><thead><tr><th>Cliente</th><th>Data</th><th>Produto</th><th>Qtd.</th><th>Total</th><th>Status</th><th>Observações</th></tr></thead><tbody>'+(list.length?list.map(p=>'<tr><td>'+esc(p.cliente_nome)+'</td><td>'+fmt(p.data_entrega)+'</td><td>'+esc(p.produto_nome)+'</td><td>'+esc(p.quantidade)+'</td><td>'+money(p.total)+'</td><td>'+esc(p.status_pedido||'Pendente')+' • '+esc(p.status_pagamento||'Pendente')+'</td><td>'+chips(p.observacoes)+'</td></tr>').join(''):'<tr><td colspan="7">Nenhum pedido no banco.</td></tr>')+'</tbody></table></div>'}
function dashboard(){return shell(cards()+'<section class="grid"><div class="panel"><h2>Pedidos reais do sistema</h2>'+table(DB.pedidos.slice(0,20))+'</div><div><div class="panel"><h2>Observações encontradas</h2>'+DB.pedidos.flatMap(p=>tags(p.observacoes)).slice(0,20).map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div><div class="panel"><h2>Resumo financeiro</h2><h1 style="color:var(--green)">'+money(resumo().lucro)+'</h1><p>Lucro estimado em 30% sobre os pedidos reais.</p></div></div></section>','Dashboard','Dados reais importados do aplicativo antigo.')}
function clientes(){return shell(cards()+'<section class="panel"><h2>Clientes do banco real</h2><div class="table"><table><thead><tr><th>Nome</th><th>Telefone</th><th>Endereço</th><th>Observações</th></tr></thead><tbody>'+DB.clientes.map(c=>'<tr><td>'+esc(c.nome)+'</td><td>'+esc(c.telefone)+'</td><td>'+esc([c.rua,c.numero,c.bairro,c.cidade].filter(Boolean).join(', '))+'</td><td>'+chips(c.observacoes)+'</td></tr>').join('')+'</tbody></table></div></section>','Clientes','Clientes carregados do sistema antigo.')}
function produtos(){return shell(cards()+'<section class="panel"><h2>Produtos reais</h2><div class="table"><table><thead><tr><th>Produto</th><th>Unidade</th><th>Preço</th><th>Lucro estimado/item</th><th>Status</th></tr></thead><tbody>'+DB.produtos.map(p=>'<tr><td>'+esc(p.nome)+'</td><td>'+esc(p.unidade)+'</td><td>'+money(p.preco)+'</td><td>'+money(Number(p.preco||0)*0.30)+'</td><td>'+(p.ativo?'Ativo':'Inativo')+'</td></tr>').join('')+'</tbody></table></div></section>','Produtos','Produtos carregados do sistema antigo.')}
function novo(){return shell('<section class="panel"><h2>Novo Pedido</h2><div class="alert">Esta tela já está com o visual novo. A criação real de pedido continua disponível no sistema principal enquanto finalizo a ligação completa dos formulários.</div><p>Clientes carregados: <b>'+DB.clientes.length+'</b></p><p>Produtos carregados: <b>'+DB.produtos.length+'</b></p></section>','Novo Pedido','Base real já importada; formulário será ligado ao banco em seguida.')}
function pedidos(){let g=group(DB.pedidos);return shell(cards()+'<section class="panel"><h2>Pedidos por data</h2>'+Object.entries(g).map(([d,l])=>{let total=l.reduce((s,p)=>s+Number(p.total||0),0),lu=l.reduce((s,p)=>s+lucro(p),0);return '<div class="order-group"><div class="group-head"><h3>Entregas '+fmt(d)+' <span class="chip">'+l.length+' pedidos</span></h3><b>Total '+money(total)+' • Lucro '+money(lu)+'</b></div>'+l.map(p=>'<article class="order"><div><b>'+esc(p.codigo||'#')+' '+esc(p.cliente_nome)+'</b><br><small>'+esc(p.cliente_telefone||'')+'</small></div><div>'+esc(p.produto_nome)+'<br><small>'+esc(p.quantidade)+'</small></div><div>'+money(p.total)+'</div><div>'+esc(p.endereco||'')+'<br>'+chips(p.observacoes)+'</div><div><span class="chip '+(p.status_pagamento==='Pago'?'ok':'bad')+'">'+esc(p.status_pagamento||'Pendente')+'</span></div><div class="actions"><button class="btn-light" onclick="patchPedido(\''+p.id+'\',{status_pedido:\'Separado\'})">Concluir venda</button><button class="btn-ok" onclick="patchPedido(\''+p.id+'\',{status_pedido:\'Entregue\'})">Entregue</button><button class="btn-light" onclick="patchPedido(\''+p.id+'\',{status_pagamento:\''+(p.status_pagamento==='Pago'?'Pendente':'Pago')+'\'})">Pago/Não pago</button></div></article>').join('')+'</div>'}).join('')+'</section>','Pedidos','Pedidos reais separados por data.')}
function entregas(){let list=DB.pedidos.filter(p=>p.tipo_entrega==='Entrega'||p.endereco);return shell(cards()+'<section class="grid"><div class="panel"><h2>Rotas e entregas</h2>'+list.map((p,i)=>'<div class="route-card"><div class="num">'+(i+1)+'</div><div><b>'+esc(p.cliente_nome)+'</b><br>'+esc(p.endereco||p.cliente_telefone||'')+'<br>'+chips(p.observacoes)+'</div><button class="btn-ok" onclick="patchPedido(\''+p.id+'\',{status_pedido:\'Entregue\'})">Marcar entregue</button></div>').join('')+'</div><div class="panel"><h2>Resumo da rota</h2><h1 style="color:var(--green)">'+money(list.reduce((s,p)=>s+Number(p.total||0),0))+'</h1><p>'+list.length+' entregas encontradas no banco.</p></div></section>','Entregas','Entregas reais carregadas do banco.')}
function relatorios(){let g=group(DB.pedidos);return shell(cards()+'<section class="grid"><div class="panel"><h2>Relatório por data</h2>'+Object.entries(g).map(([d,l])=>'<p><b>'+fmt(d)+'</b><br>'+l.length+' pedidos • Total '+money(l.reduce((s,p)=>s+Number(p.total||0),0))+' • Lucro '+money(l.reduce((s,p)=>s+lucro(p),0))+'</p>').join('')+'</div><div class="panel"><h2>Lucro visual</h2><div class="chart"><div class="bar" style="height:35%"></div><div class="bar" style="height:55%"></div><div class="bar" style="height:70%"></div><div class="bar" style="height:88%"></div></div></div></section>','Relatórios','Relatórios gerados com os pedidos reais.')}
function admins(){return shell('<section class="panel"><h2>Admins reais</h2>'+DB.admins.map(a=>'<p><b>'+esc(a.nome)+'</b><br>'+esc(a.telefone)+' • '+esc(a.papel||'Administrador')+'</p>').join('')+'</section>','Admins','Administradores carregados do sistema antigo.')}
function render(){let pages={dashboard,clientes,produtos,'novo pedido':novo,pedidos,entregas,'relatórios':relatorios,admins};root.innerHTML=(pages[tab]||dashboard)()}
load();
</script>
</body>
</html>
