<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#123d27" />
    <meta name="application-name" content="Queijos WR" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Queijos WR" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="Queijos WR para gestão de clientes, pedidos, entregas e caixa." />
    <link rel="icon" href="/wr-app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/wr-app-icon.svg" />
    <link rel="stylesheet" href="/wr-brand-icons.css" />
    <link rel="stylesheet" href="/wr-visible-icons.css" />
    <link rel="stylesheet" href="/login-branding.css" />
    <link rel="stylesheet" href="/notification-center.css" />
    <title>Queijos WR</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const replacements = [
          [/Entrar no ERP/g, 'Entrar'],
          [/ERP Queijos WR/g, 'Queijos WR'],
          [/Queijos WR ERP/g, 'Queijos WR'],
          [/ERP Gestão/g, 'Gestão']
        ];

        const removeErp = value => replacements.reduce(
          (text, [pattern, replacement]) => text.replace(pattern, replacement),
          value
        );

        const cleanNode = node => {
          if (node.nodeType === Node.TEXT_NODE) {
            const cleaned = removeErp(node.nodeValue || '');
            if (cleaned !== node.nodeValue) node.nodeValue = cleaned;
            return;
          }

          if (!(node instanceof Element)) return;
          const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
          let current;
          while ((current = walker.nextNode())) cleanNode(current);
        };

        const observer = new MutationObserver(mutations => {
          mutations.forEach(mutation => {
            mutation.addedNodes.forEach(cleanNode);
            if (mutation.type === 'characterData') cleanNode(mutation.target);
          });
        });

        window.addEventListener('DOMContentLoaded', () => {
          cleanNode(document.body);
          observer.observe(document.body, {
            childList: true,
            subtree: true,
            characterData: true
          });
        });
      })();
    </script>
    <script defer src="/notification-center.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
