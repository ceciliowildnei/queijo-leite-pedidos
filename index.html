<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f2d18" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Queijos WR" />
    <meta name="application-name" content="Queijos WR" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/pwa-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/pwa-icon.svg" />
    <title>Queijos WR Pedidos</title>
    <script>
      (function(){
        function apenasNumeros(valor){ return String(valor || '').replace(/\D/g, ''); }
        function normalizar(valor){ return String(valor || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
        function dinheiro(valor){ return Number(valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
        function perfilDoTelefone(tel){
          if(tel === '18997232533') return { nome: 'Wildnei', papel: 'ADM Geral', limitado: false };
          if(tel === '18996454360') return { nome: 'Wilson', papel: 'Colaborador', limitado: true };
          if(tel === '18997670950') return { nome: 'Roseli', papel: 'Colaborador', limitado: true };
          return { nome: 'Usuário', papel: 'Colaborador', limitado: true };
        }
        function celularSalvo(){ return apenasNumeros(sessionStorage.getItem('wr_telefone_logado') || ''); }
        function aplicarAcesso(){
          var tel = celularSalvo();
          if(!tel) return;
          var perfil = perfilDoTelefone(tel);
          var span = document.querySelector('header span');
          var textoPerfil = perfil.nome + ' • ' + perfil.papel;
          if(span && span.textContent !== textoPerfil) span.textContent = textoPerfil;
          var permitidos = ['dashboard','relatorio','clientes','novo pedido'];
          document.querySelectorAll('nav button').forEach(function(botao){
            var texto = normalizar(botao.textContent || '');
            var visivel = !perfil.limitado || permitidos.indexOf(texto) >= 0;
            var display = visivel ? '' : 'none';
            if(botao.style.display !== display) botao.style.display = display;
          });
        }
        function formatarData(valor){
          if(!valor || valor === '-') return 'Sem data definida';
          var partes = String(valor).trim().slice(0,10).split('-');
          if(partes.length === 3) return partes[2] + '/' + partes[1] + '/' + partes[0];
          return String(valor).trim();
        }
        function chaveOrdenacaoData(valor){
          if(!valor || valor === '-' || valor === 'Sem data definida') return '9999-99-99';
          var texto = String(valor).trim();
          if(/^\d{2}\/\d{2}\/\d{4}$/.test(texto)) return texto.split('/').reverse().join('-');
          return texto.slice(0,10);
        }
        function estilizarTituloData(titulo){
          titulo.style.margin = '22px 0 12px';
          titulo.style.padding = '10px 12px';
          titulo.style.borderRadius = '14px';
          titulo.style.background = 'rgba(79,45,24,0.08)';
          titulo.style.border = '1px solid rgba(79,45,24,0.18)';
          titulo.style.color = '#4f2d18';
          titulo.style.fontSize = '1.05rem';
          titulo.style.fontWeight = '900';
        }
        function aplicarBotaoRecolher(bloco){
          if(!bloco || bloco.dataset.botaoRecolher === 'sim') return;
          var titulo = bloco.querySelector(':scope > h3');
          if(!titulo) return;
          var botao = document.createElement('button');
          botao.type = 'button';
          botao.textContent = 'Recolher pedidos';
          botao.style.margin = '0 0 12px';
          botao.style.padding = '8px 14px';
          botao.style.borderRadius = '12px';
          botao.style.border = '1px solid rgba(79,45,24,0.25)';
          botao.style.background = '#fff8ea';
          botao.style.color = '#4f2d18';
          botao.style.fontWeight = '900';
          botao.style.cursor = 'pointer';
          botao.onclick = function(){
            var fechado = bloco.dataset.fechado === 'sim';
            Array.from(bloco.children).forEach(function(el){
              if(el !== titulo && el !== botao) el.style.display = fechado ? '' : 'none';
            });
            bloco.dataset.fechado = fechado ? 'nao' : 'sim';
            botao.textContent = fechado ? 'Recolher pedidos' : 'Visualizar pedidos';
          };
          titulo.insertAdjacentElement('afterend', botao);
          bloco.dataset.botaoRecolher = 'sim';
        }
        function aplicarBotoesRecolher(){
          document.querySelectorAll('.grupo-data-pedidos, .grupo-data-relatorio').forEach(aplicarBotaoRecolher);
        }
        function separarPedidosPorData(){
          var painel = Array.from(document.querySelectorAll('section.panel.wide')).find(function(sec){
            var h2 = sec.querySelector('h2');
            return h2 && normalizar(h2.textContent).indexOf('lista de pedidos') >= 0;
          });
          if(!painel || painel.dataset.separadoPorData === 'sim') return;
          var pedidos = Array.from(painel.querySelectorAll(':scope > article.pedido'));
          if(pedidos.length < 2) return;
          var grupos = {};
          pedidos.forEach(function(card){
            var texto = card.textContent || '';
            var achou = texto.match(/entrega:\s*([0-9]{4}-[0-9]{2}-[0-9]{2}|[0-9]{2}\/[0-9]{2}\/[0-9]{4}|-)/i);
            var data = achou ? achou[1] : 'Sem data definida';
            if(!grupos[data]) grupos[data] = [];
            grupos[data].push(card);
          });
          var ordenar = Object.keys(grupos).sort(function(a,b){ return chaveOrdenacaoData(a).localeCompare(chaveOrdenacaoData(b)); });
          pedidos.forEach(function(card){ card.remove(); });
          ordenar.forEach(function(data){
            var bloco = document.createElement('div');
            bloco.className = 'grupo-data-pedidos';
            var titulo = document.createElement('h3');
            titulo.textContent = 'Entrega: ' + formatarData(data) + ' — ' + grupos[data].length + (grupos[data].length > 1 ? ' pedidos' : ' pedido');
            estilizarTituloData(titulo);
            bloco.appendChild(titulo);
            grupos[data].forEach(function(card){ bloco.appendChild(card); });
            painel.appendChild(bloco);
            aplicarBotaoRecolher(bloco);
          });
          painel.dataset.separadoPorData = 'sim';
        }
        async function credenciaisSupabase(){
          if(window.__wrSupabaseCreds) return window.__wrSupabaseCreds;
          var script = Array.from(document.querySelectorAll('script[src]')).find(function(s){ return (s.src || '').indexOf('/assets/index-') >= 0 || (s.src || '').indexOf('/src/main.jsx') >= 0; });
          if(!script) return null;
          var texto = await fetch(script.src, { cache: 'no-store' }).then(function(r){ return r.text(); }).catch(function(){ return ''; });
          var url = (texto.match(/https:\/\/[a-z0-9]+\.supabase\.co/i) || [])[0];
          var key = (texto.match(/sb_publishable_[A-Za-z0-9_\-]+/) || [])[0];
          if(!url || !key) return null;
          window.__wrSupabaseCreds = { url: url, key: key };
          return window.__wrSupabaseCreds;
        }
        async function separarRelatorioPorData(){
          var painel = Array.from(document.querySelectorAll('section.panel.wide')).find(function(sec){
            var h2 = sec.querySelector('h2');
            return h2 && normalizar(h2.textContent).indexOf('relatorio simples') >= 0;
          });
          if(!painel || painel.dataset.relatorioPorData === 'sim') return;
          var tabelaOriginal = painel.querySelector('table.relatorio');
          if(!tabelaOriginal) return;
          var creds = await credenciaisSupabase();
          if(!creds) return;
          var url = creds.url + '/rest/v1/wr_pedidos?select=*&order=data_entrega.asc&order=criado_em.desc';
          var dados = await fetch(url, { headers: { apikey: creds.key, Authorization: 'Bearer ' + creds.key } }).then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; });
          if(!Array.isArray(dados) || dados.length === 0) return;
          var grupos = {};
          dados.forEach(function(p){
            var data = p.data_entrega || 'Sem data definida';
            if(!grupos[data]) grupos[data] = [];
            grupos[data].push(p);
          });
          var container = document.createElement('div');
          container.className = 'relatorio-por-data';
          Object.keys(grupos).sort(function(a,b){ return chaveOrdenacaoData(a).localeCompare(chaveOrdenacaoData(b)); }).forEach(function(data){
            var lista = grupos[data];
            var totalDia = lista.reduce(function(s,p){ return s + Number(p.total || 0); }, 0);
            var bloco = document.createElement('div');
            bloco.className = 'grupo-data-relatorio';
            var titulo = document.createElement('h3');
            titulo.textContent = 'Entrega: ' + formatarData(data) + ' — ' + lista.length + (lista.length > 1 ? ' pedidos' : ' pedido') + ' — Total: ' + dinheiro(totalDia);
            estilizarTituloData(titulo);
            var wrap = document.createElement('div');
            wrap.className = 'tabela-wrap';
            var tabela = document.createElement('table');
            tabela.className = 'relatorio';
            tabela.innerHTML = '<thead><tr><th>Nome</th><th>Pedido</th><th>Qtd.</th><th>Total</th></tr></thead><tbody></tbody>';
            var tbody = tabela.querySelector('tbody');
            lista.forEach(function(p){
              var tr = document.createElement('tr');
              tr.innerHTML = '<td></td><td></td><td></td><td></td>';
              tr.children[0].textContent = p.cliente_nome || '';
              tr.children[1].textContent = p.produto_nome || '';
              tr.children[2].textContent = p.quantidade || '';
              tr.children[3].textContent = dinheiro(p.total || 0);
              tbody.appendChild(tr);
            });
            wrap.appendChild(tabela);
            bloco.appendChild(titulo);
            bloco.appendChild(wrap);
            container.appendChild(bloco);
            aplicarBotaoRecolher(bloco);
          });
          var antigo = painel.querySelector('.tabela-wrap');
          if(antigo) antigo.replaceWith(container);
          painel.dataset.relatorioPorData = 'sim';
        }
        function vigiarPedidos(){
          setTimeout(separarPedidosPorData, 300);
          setTimeout(separarPedidosPorData, 900);
          setTimeout(separarPedidosPorData, 1800);
          setTimeout(aplicarBotoesRecolher, 2000);
        }
        function vigiarRelatorio(){
          setTimeout(separarRelatorioPorData, 300);
          setTimeout(separarRelatorioPorData, 900);
          setTimeout(separarRelatorioPorData, 1800);
          setTimeout(aplicarBotoesRecolher, 2000);
        }
        document.addEventListener('submit', function(){
          var campo = document.querySelector('input[placeholder="Celular"]');
          if(campo) sessionStorage.setItem('wr_telefone_logado', apenasNumeros(campo.value));
          setTimeout(aplicarAcesso, 500);
          setTimeout(aplicarAcesso, 1500);
          vigiarPedidos();
          vigiarRelatorio();
        }, true);
        document.addEventListener('click', function(ev){
          var alvo = ev.target;
          if(alvo && alvo.textContent && normalizar(alvo.textContent) === 'sair') sessionStorage.removeItem('wr_telefone_logado');
          setTimeout(aplicarAcesso, 300);
          vigiarPedidos();
          vigiarRelatorio();
        }, true);
        window.addEventListener('load', function(){
          setTimeout(aplicarAcesso, 300);
          setTimeout(aplicarAcesso, 1200);
          setTimeout(aplicarAcesso, 2500);
          vigiarPedidos();
          vigiarRelatorio();
          var obs = new MutationObserver(function(){
            aplicarAcesso();
            separarPedidosPorData();
            separarRelatorioPorData();
            aplicarBotoesRecolher();
          });
          obs.observe(document.body, { childList: true, subtree: true });
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function(){
        function setSelectValue(select, value){
          if(!select) return;
          var setter = Object.getOwnPropertyDescriptor(window.HTMLSelectElement.prototype, 'value').set;
          setter.call(select, value);
          select.dispatchEvent(new Event('change', { bubbles: true }));
        }
        function buttonStyle(btn, bg, color){
          btn.type = 'button';
          btn.style.margin = '4px';
          btn.style.padding = '8px 12px';
          btn.style.borderRadius = '12px';
          btn.style.border = '1px solid rgba(79,45,24,.2)';
          btn.style.background = bg;
          btn.style.color = color || '#4f2d18';
          btn.style.fontWeight = '900';
          btn.style.cursor = 'pointer';
        }
        function encontrarSelect(article, valores){
          return Array.from(article.querySelectorAll('select')).find(function(sel){
            var opts = Array.from(sel.options).map(function(o){ return o.value || o.textContent; });
            return valores.every(function(v){ return opts.indexOf(v) >= 0; });
          });
        }
        function atualizarTextoPagamento(botao, select){
          var pago = select && select.value === 'Pago';
          botao.textContent = pago ? 'Pago ✓' : 'Não pago';
          botao.style.background = pago ? '#d9f7df' : '#fff4d6';
          botao.style.color = pago ? '#145a25' : '#6b3d17';
        }
        function ajustarAcoesPedidos(){
          document.querySelectorAll('article.pedido').forEach(function(article){
            if(article.dataset.acoesVenda === 'sim') return;
            var statusPedido = encontrarSelect(article, ['Pendente','Separado','Entregue','Cancelado']);
            var statusPagamento = encontrarSelect(article, ['Pendente','Pago']);
            var area = article.querySelector('div:last-child') || article;
            if(statusPedido){
              statusPedido.style.display = 'none';
              var concluir = document.createElement('button');
              concluir.textContent = 'Concluir venda';
              buttonStyle(concluir, '#e9f7df', '#245317');
              concluir.onclick = function(){ setSelectValue(statusPedido, 'Separado'); };
              var entregue = document.createElement('button');
              entregue.textContent = 'Entregue';
              buttonStyle(entregue, '#dff1ff', '#164466');
              entregue.onclick = function(){ setSelectValue(statusPedido, 'Entregue'); };
              area.insertBefore(concluir, area.firstChild);
              area.insertBefore(entregue, concluir.nextSibling);
            }
            if(statusPagamento){
              statusPagamento.style.display = 'none';
              var pagamento = document.createElement('button');
              buttonStyle(pagamento, '#fff4d6', '#6b3d17');
              atualizarTextoPagamento(pagamento, statusPagamento);
              pagamento.onclick = function(){
                setSelectValue(statusPagamento, statusPagamento.value === 'Pago' ? 'Pendente' : 'Pago');
                setTimeout(function(){ atualizarTextoPagamento(pagamento, statusPagamento); }, 80);
              };
              statusPagamento.insertAdjacentElement('afterend', pagamento);
            }
            article.dataset.acoesVenda = 'sim';
          });
        }
        window.addEventListener('load', function(){
          setTimeout(ajustarAcoesPedidos, 400);
          setTimeout(ajustarAcoesPedidos, 1200);
          setTimeout(ajustarAcoesPedidos, 2500);
          new MutationObserver(ajustarAcoesPedidos).observe(document.body, { childList: true, subtree: true });
        });
        document.addEventListener('click', function(){ setTimeout(ajustarAcoesPedidos, 300); }, true);
      })();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
