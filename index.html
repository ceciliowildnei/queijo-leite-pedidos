<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f2d18" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Queijos WR" />
    <meta name="application-name" content="Queijos WR" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/pwa-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/pwa-icon.svg" />
    <title>Queijos WR Pedidos</title>
    <script>
      (function(){
        function apenasNumeros(valor){ return String(valor || '').replace(/\D/g, ''); }
        function normalizar(valor){ return String(valor || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
        function perfilDoTelefone(tel){
          if(tel === '18997232533') return { nome: 'Wildnei', papel: 'ADM Geral', limitado: false };
          if(tel === '18996454360') return { nome: 'Wilson', papel: 'Colaborador', limitado: true };
          if(tel === '18997670950') return { nome: 'Roseli', papel: 'Colaborador', limitado: true };
          return { nome: 'Usuário', papel: 'Colaborador', limitado: true };
        }
        function celularSalvo(){ return apenasNumeros(sessionStorage.getItem('wr_telefone_logado') || ''); }
        function aplicarAcesso(){
          var tel = celularSalvo();
          if(!tel) return;
          var perfil = perfilDoTelefone(tel);
          var span = document.querySelector('header span');
          var textoPerfil = perfil.nome + ' • ' + perfil.papel;
          if(span && span.textContent !== textoPerfil) span.textContent = textoPerfil;
          var permitidos = ['dashboard','relatorio','clientes','novo pedido'];
          document.querySelectorAll('nav button').forEach(function(botao){
            var texto = normalizar(botao.textContent || '');
            var visivel = !perfil.limitado || permitidos.indexOf(texto) >= 0;
            var display = visivel ? '' : 'none';
            if(botao.style.display !== display) botao.style.display = display;
          });
        }
        document.addEventListener('submit', function(){
          var campo = document.querySelector('input[placeholder="Celular"]');
          if(campo) sessionStorage.setItem('wr_telefone_logado', apenasNumeros(campo.value));
          setTimeout(aplicarAcesso, 500);
          setTimeout(aplicarAcesso, 1500);
        }, true);
        document.addEventListener('click', function(ev){
          var alvo = ev.target;
          if(alvo && alvo.textContent && normalizar(alvo.textContent) === 'sair') sessionStorage.removeItem('wr_telefone_logado');
        }, true);
        window.addEventListener('load', function(){
          setTimeout(aplicarAcesso, 300);
          setTimeout(aplicarAcesso, 1200);
          setTimeout(aplicarAcesso, 2500);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
