  <body>
    <div id="root"></div>
    <script>
      (() => {
        const replacements = [
          [/Entrar no ERP/g, 'Entrar'],
          [/ERP Queijos WR/g, 'Queijos WR'],
          [/Queijos WR ERP/g, 'Queijos WR'],
          [/ERP Gestão/g, 'Gestão']
        ];
        const removeErp = value => replacements.reduce((text, [pattern, replacement]) => text.replace(pattern, replacement), value);
        const cleanNode = node => {
          if (node.nodeType === Node.TEXT_NODE) {
            const cleaned = removeErp(node.nodeValue || '');
            if (cleaned !== node.nodeValue) node.nodeValue = cleaned;
            return;
          }
          if (!(node instanceof Element)) return;
          const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
          let current;
          while ((current = walker.nextNode())) cleanNode(current);
        };
        const observer = new MutationObserver(mutations => {
          mutations.forEach(mutation => {
            mutation.addedNodes.forEach(cleanNode);
            if (mutation.type === 'characterData') cleanNode(mutation.target);
          });
        });
        window.addEventListener('DOMContentLoaded', () => {
          cleanNode(document.body);
          observer.observe(document.body, { childList: true, subtree: true, characterData: true });
        });
      })();
    </script>
